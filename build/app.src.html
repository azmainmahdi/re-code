/* themes: Guide = the Interviewer guide's palette (Night: soft slate, softer text, purple accent, clear green codes, for long reading; Day and Night both purple); Paper = the warm sheet, light only (JS swaps it for Guide in dark) */

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--pend);color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea{caret-color:var(--acc)}
.bn{font-family:var(--rf)}
.i{width:18px;height:18px;flex:none;display:block}
.flip .i{transform:scaleX(-1)}
.i.s{width:15px;height:15px}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid transparent;background-clip:content-box}
kbd{font:600 12px var(--ui);background:var(--sub);color:var(--mute);border-radius:6px;padding:1px 6px;min-width:20px;display:inline-block;text-align:center}
[hidden]{display:none!important}

/* controls: one shape */
.btn{height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border-radius:10px;background:var(--panel);font-size:13px;white-space:nowrap;box-shadow:var(--shadow-s);transition:filter .12s,background .12s}
.btn:hover{filter:brightness(.97)}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn.acc{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--hover)}
.btn.on{background:var(--hover);color:var(--ink)}
.seg{display:inline-flex;background:var(--segbg);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:10px;font-size:13px;color:var(--mute);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}

.save{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--mute);white-space:nowrap;height:30px;padding:0 10px;border-radius:99px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.save.warn{background:var(--warn);color:var(--warnk)}.save.warn i{background:var(--warnk)}
.field{width:100%;border:0;border-radius:10px;background:var(--panel);padding:9px 12px;font-size:14px;box-shadow:var(--shadow-s)}
.field:focus{outline:2px solid var(--acc);outline-offset:0}
textarea.field{resize:vertical;min-height:70px;line-height:1.5}

/* transcript picker */
.pick{height:36px;display:inline-flex;align-items:center;gap:9px;padding:0 10px 0 6px;border-radius:10px;background:var(--panel);box-shadow:var(--shadow-s);white-space:nowrap}
.pick .av{width:26px;height:26px;font-size:12px}
.pick b{font-size:14px}
.pick small{color:var(--mute);font-size:12px}
.bar{width:44px;height:5px;border-radius:6px;background:var(--sub);overflow:hidden;display:inline-block}
.bar span{display:block;height:100%;background:var(--acc);border-radius:6px}

.findbar .field{max-width:360px;height:36px}
.findbar small{color:var(--mute);font-size:13px;min-width:60px}
.dgrid{display:grid;grid-template-columns:minmax(0,var(--dw,860px));gap:22px;justify-content:center}
.dgrid:has(.outline){grid-template-columns:220px minmax(0,var(--dw,860px))}
@container (max-width:800px){.dgrid,.dgrid:has(.outline){grid-template-columns:minmax(0,1fr)}.outline{display:none}}
.turns{min-width:0}
.turn{display:grid;grid-template-columns:38px minmax(0,1fr);column-gap:12px;margin:0 0 10px;scroll-margin-top:110px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:650 12px var(--ui);flex:none;user-select:none}
.pt .av{background:var(--pav);color:var(--pavk)}
.az .av{background:var(--azav);color:var(--faint);box-shadow:inset 0 0 0 1.5px var(--line)}
.tx{min-width:0;border-radius:14px;padding:8px 14px 10px;transition:background .3s,opacity .2s}
.pt .tx{background:var(--lane);box-shadow:var(--shadow-s)}
.who{display:flex;align-items:baseline;gap:8px;font-size:12px;user-select:none;margin-bottom:1px}
.who b{font-weight:650}
.pt .who b{color:var(--pavk)}
.az .who b{color:var(--faint)}
.who .ts{color:var(--faint);font-variant-numeric:tabular-nums;transition:opacity .15s;order:9;margin-left:auto}
.ts-hover .who .ts{opacity:0}.ts-hover .turn:hover .who .ts{opacity:1}
.body{font-size:var(--rs);line-height:var(--rlh);white-space:pre-wrap;overflow-wrap:anywhere}
.sheet .desk,.sheet .deskhead{background:var(--paper)}
.sheet .turn .tx{background:none;box-shadow:none;border-radius:0;padding:4px 2px 16px;border-bottom:1px solid var(--rule)}
.sheet .turn{margin-bottom:12px}
.sheet .pt .body{color:var(--pink)}
.sheet .pt .av{background:var(--ppav);color:var(--ppavk)}
.sheet .pt .who b{color:var(--pwho)}
.az .body{font-size:calc(var(--rs) - 2px);color:var(--mute)}
.az-dim .az .tx{opacity:.55}
.az-dim .az .tx:hover{opacity:1}
.az-hide .az:not(.open) .body{display:none}
.az-hide .az:not(.open) .tx{padding:4px 14px;cursor:pointer}
.az-hide .az:not(.open) .who::after{content:"question hidden, click to show";color:var(--faint);font-weight:400}
.az-hide .az:not(.open) .av{width:26px;height:26px;font-size:12px;margin:2px 4px}
.turn.flash .tx{animation:flash 1.8s ease-out}
@keyframes flash{0%,30%{background:var(--accs)}}
.schip.flash{animation:flash 1.8s ease-out}
mark{--mf:oklch(var(--cfL) var(--cfC) var(--h,155));--mf2:oklch(var(--cfL) var(--cfC) var(--h2,155));background:var(--mf);color:inherit;border-radius:6px;cursor:pointer;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .15s,box-shadow .15s}
mark.r2{--cfL:var(--cfL2)}
mark.multi{background:linear-gradient(to right in oklab,var(--mf),oklch(var(--cfL) calc(var(--cfC)*1.3) var(--h,155)) 44%,oklch(var(--cfL) calc(var(--cfC)*1.3) var(--h2,155)) 56%,var(--mf2));-webkit-box-decoration-break:slice;box-decoration-break:slice} /* two codes on the same words: slice runs the fade across all its lines. Only the two code colours: each gets richer toward a short crossover in the middle, so no third hue appears and the grey between opposite hues has no room to show. Only two colours: no quote has three codes yet */
mark.glow,mark:hover{--cfL:var(--cfLg)}
mark.pend.newsel{background:var(--pend);box-shadow:none} /* a new selection; no box (3 Nov): the start and end bars (.hdl) show the edges and drag */
.desk:has(mark.pend:not(.newsel)) mark[data-h]:not(.pend):not(.ponly){background:color-mix(in srgb,var(--mf) 35%,transparent)}
.desk:has(mark.pend:not(.newsel)) .mcard:not(.sel){opacity:.5}
mark.ponly:not(.pend){background:none;box-shadow:none}
mark.sug{background:none;box-shadow:none;border-bottom:2px dashed var(--acc);border-radius:0;padding:0 0 1px}
mark.sug.glow,mark.sug:hover{background:var(--hl)}
.reading mark.sug{border:0}
.hdl{position:relative;display:inline-block;width:0;height:1.15em;vertical-align:-.22em}
.hdl i{position:absolute;left:-9px;width:18px;top:-5px;bottom:-5px;cursor:ew-resize;touch-action:none}
.hdl i::before{content:'';position:absolute;left:7.5px;top:4px;bottom:4px;width:3px;border-radius:6px;background:var(--hb,var(--acc))}
.hdl i::after{content:'';position:absolute;left:4px;width:10px;height:10px;border-radius:50%;background:var(--hb,var(--acc));box-shadow:0 0 0 2px var(--paper)}
.hdl.s i::after{top:0}.hdl.e i::after{bottom:0}
body.hdragging,body.hdragging *{cursor:ew-resize!important;user-select:none}
body.hdragging .hdl i{pointer-events:none}
.reading .hdl{display:none}
.schip{font-size:13px;line-height:1.35;border-radius:99px;border:1.5px dashed var(--acc);color:var(--acck);display:inline-flex;align-items:center;max-width:100%;user-select:none}
.schip .sl{padding:3px 4px 3px 10px;text-align:left;cursor:pointer}
.schip .sl:hover{text-decoration:underline}
.schip button.sa,.schip button.sr{width:26px;height:24px;display:grid;place-items:center;border-radius:99px;color:var(--mute)}
.schip button.sa:hover{background:var(--accs);color:var(--acck)}.schip button.sr:hover{background:var(--sub);color:var(--ink)}
.schip .i{width:14px;height:14px}
.turn.playing .av{background:var(--acc);color:var(--onacc);box-shadow:none}.turn.playing .who .ts{opacity:1;color:var(--acck)}
.who .ts{cursor:pointer}.who .ts:hover{color:var(--acck);text-decoration:underline}
.player{display:flex;align-items:center;gap:6px;margin:0 22px 10px 26px;padding:6px 8px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow-s);min-width:0}
.player[hidden]{display:none}
.player .btn{box-shadow:none;height:32px}.player .at{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:40px;text-align:center}
.player .spd{padding:0 8px;font-size:13px;color:var(--mute)}
.player input[type=range]{flex:1;min-width:60px;accent-color:var(--acc);height:20px;cursor:pointer}
.player.mini{width:max-content;margin-left:auto;padding:3px 6px}.player.mini :is(#audSeek,.dur,#audSpd){display:none}
.tplay{order:10;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:var(--faint);opacity:.45;transition:opacity .15s;align-self:center}
.tplay .i{width:13px;height:13px}.tplay .pz{display:none}
.turn:hover .tplay,.turn.playing .tplay{opacity:1}.tplay:hover{background:var(--hover);color:var(--acck)}
.turn.playing .tplay{color:var(--acck)}.aplaying .turn.playing .tplay .pl{display:none}.aplaying .turn.playing .tplay .pz{display:block}
.reading mark{background:none;box-shadow:none;cursor:text}
.reading .m{visibility:hidden} /* keep the space, so switching to Read doesn't move the text */
::highlight(find){background:var(--find);color:inherit}
::highlight(findcur){background:var(--findcur);color:#1c1b19}
.m{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.m:empty{display:none}
.chip{font-size:13px;line-height:1.35;padding:4px 10px 4px 8px;border-radius:99px;background:var(--cdp);color:var(--cdk);text-align:left;cursor:grab;max-width:100%;display:inline-flex;gap:6px;align-items:center}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;opacity:.7}
.chip.r2{background:var(--cdp2);color:var(--cdk2)}
.chip:hover{filter:brightness(.96)}
.dragging{opacity:.4}
.empty{max-width:520px;margin:70px auto;text-align:center;color:var(--mute)}
.empty .logo{margin:0 auto 18px;width:56px;height:56px;border-radius:14px}
.empty .logo .i{width:30px;height:30px}
.empty h2{font-size:22px;color:var(--ink);margin:0 0 8px}
.empty ol{text-align:left;display:inline-block;margin:6px 0 22px;padding-left:20px;line-height:1.9}
.grip{display:flex;align-items:center;justify-content:center;cursor:col-resize}
.grip span{width:4px;height:44px;border-radius:6px;background:var(--line)}
.grip:hover span{background:var(--acc)}

/* interview map: sections from the guide's question clicks */
.secband{display:flex;align-items:center;gap:10px;margin:34px 0 4px 50px;padding:0 0 10px;scroll-margin-top:90px;border-bottom:2px solid var(--line)}

.qmark{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 8px;align-items:center;margin:18px 0 12px 50px;padding:0 0 12px;border-bottom:1px solid var(--line);scroll-margin-top:120px}
.sheet .qmark{border-color:var(--rule)}

.ans{font-weight:600;color:var(--q);background:var(--qs);border-radius:99px;padding:1px 8px;font-size:12px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold{display:flex;align-items:center;gap:12px;margin:6px 0 14px 50px;background:var(--sub);border-radius:14px;padding:12px 14px;color:var(--mute);font-size:13px}
.fold b{color:var(--ink);font-weight:600}
.fold .grow{flex:1}
.linebanner{display:flex;gap:12px;align-items:center;background:var(--warn);color:var(--warnk);border-radius:14px;padding:12px 14px;margin:6px 0 14px;font-size:13px}
.picking .turn.az .tx,.picking .turn.pt .tx{cursor:crosshair}
.picking .turn:hover .tx{box-shadow:0 0 0 2px var(--acc)}
.map{min-width:0;overflow:auto;padding:2px 6px 40px 10px;background:var(--wall)}
.map[hidden]{display:none}
.maphead{display:flex;align-items:flex-start;gap:6px;padding:14px 6px 4px 18px;min-width:0;overflow:hidden;background:var(--wall);border-radius:0 16px 0 0}.maphead h3{flex:1;margin:7px 0 0;font-size:16px;font-weight:650;color:var(--ink);white-space:nowrap}
.maphead:has(h3:only-child),.maphead:empty{padding:0}
@media (max-width:1100px){.maphead{display:none}}
.map.folded{padding:12px 4px;overflow:hidden}
@media (max-width:1100px){.view[data-view=code]{--mapw:0px!important}.map{display:none}}
.outline{padding:0 2px 20px}
.outline h3{font-size:12px;font-weight:650;color:var(--faint);margin:0 0 4px}
.outline p{font-size:12px;color:var(--faint);margin:0 0 10px;line-height:1.45}
.ol-sec{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:10px;font-size:13px;font-weight:600}
.ol-sec:hover,.ol-q:hover{background:var(--hover)}
.ol-sec .sk{font:700 12px var(--ui);color:var(--acck);background:var(--accs);border-radius:6px;padding:2px 6px;min-width:30px;text-align:center}
.ol-sec .n{margin-left:auto;font-size:12px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.ol-sec .n.has{color:var(--acck)}
.ol-q{display:block;width:100%;text-align:left;padding:4px 8px 4px 46px;border-radius:10px;font-size:12px;color:var(--mute)}.ol-q:hover{color:var(--ink)}
.ol-skip{opacity:.55}
.ol-row{display:flex;align-items:center}.ol-row .ol-sec{flex:1;min-width:0}
.ol-done{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:var(--faint);opacity:.4}.ol-done .i{width:15px;height:15px}
.ol-row:hover .ol-done{opacity:.8}.ol-done:hover{background:var(--hover);opacity:1}
.ol-done.on{color:var(--ink);opacity:1}.ol-sec.done{color:var(--mute)}.ol-sec.done .sk{background:var(--ink);color:var(--bg)}
.ol-bm{display:flex;gap:8px;width:100%;text-align:left;padding:5px 8px;border-radius:10px;font-size:12px;color:var(--mute);overflow:hidden}.ol-bm:hover{background:var(--hover);color:var(--ink)}
.ol-bm .t{flex:none;color:var(--acck);font-variant-numeric:tabular-nums;font-weight:600}.ol-bm span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outline .ol-gap{height:10px}
.tbm{order:11;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:var(--faint);opacity:.45;transition:opacity .15s;align-self:center}
.tbm .i{width:13px;height:13px}
.tcm{order:12;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:var(--faint);opacity:.45;transition:opacity .15s;align-self:center}.tcm .i{width:13px;height:13px}.turn:hover .tcm{opacity:1}.tcm:hover{background:var(--hover);color:var(--amb)}
.turn{position:relative}
.cmc{position:absolute;left:calc(100% + 18px);top:0;width:252px;display:flex;flex-direction:column;gap:8px;z-index:2;transition:top .22s cubic-bezier(.2,.8,.2,1);--cmk:#f06a0a}
.cmk{--cmk:#f06a0a;text-decoration:underline 2.5px var(--cmk);text-underline-offset:5px;text-decoration-skip-ink:none;background:color-mix(in srgb,var(--cmk) 10%,transparent);border-radius:3px;cursor:pointer;transition:background .15s}
.cmk.on,.cmk.new{background:color-mix(in srgb,var(--cmk) 26%,transparent)}
.cmt{position:relative;padding:10px 12px;border-radius:12px;background:var(--panel);box-shadow:0 1px 2px rgba(20,24,40,.06),0 4px 14px rgba(20,24,40,.07);font:13px/1.5 var(--ui);color:var(--ink);transition:box-shadow .15s,transform .15s}
.cmt::after{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--cmk);opacity:0;transition:opacity .15s}
.cmt.on{box-shadow:0 1px 2px rgba(20,24,40,.08),0 8px 22px rgba(20,24,40,.12)}.cmt.on::after,.cmt.flash::after{opacity:1}.cmt.flash{transform:translateX(-3px)}
.cmt .ch{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:12px}.cmt .ch b{color:var(--ink);font-weight:600;font-size:12.5px}.cmt .cdt{color:var(--faint);font-size:11.5px}
.cmt .cav{flex:none;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--cmk);color:#fff;font-weight:700;font-size:11px;text-transform:uppercase}.cmt .cav.sm{width:18px;height:18px;font-size:10px;background:color-mix(in srgb,var(--cmk) 70%,var(--ink))}
.cmt .cic{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;color:var(--mute);opacity:0;transition:opacity .12s}.cmt:hover .cic,.cmt.on .cic{opacity:1}.cmt .cic:hover{background:var(--hover);color:var(--ink)}.cmt .cic .i{width:14px;height:14px}
.cmt .ch button:not(.cic){padding:4px 10px;border-radius:8px;color:var(--mute);font-size:12px}.cmt .ch button:not(.cic):hover{background:var(--hover);color:var(--ink)}.cmt .ch button.pri{background:var(--cmk);color:#fff}
.cmt .cb{white-space:pre-wrap;margin-top:6px;overflow-wrap:anywhere}
.cmt .crr{display:flex;gap:7px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}.cmt .crr b{color:var(--ink);font-weight:600}.cmt .crr .cb{margin-top:2px;font-size:13px;color:var(--ink)}
.cmt .crep{margin-top:6px;padding:0;font-size:12px;color:var(--faint);opacity:0;transition:opacity .12s}.cmt:hover .crep,.cmt.on .crep{opacity:1}.cmt .crep:hover{color:var(--cmk)}
.cmt .cin{display:block;width:100%;margin-top:8px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13px/1.45 var(--ui);resize:vertical;outline:none}.cmt .cin:focus{border-color:var(--cmk)}.cmt.new .cin{margin-top:0}.cmt.new .ch{margin-top:8px}
.cmin .cmc{position:static;width:auto;grid-column:2;margin-top:8px}.cmin .cmc::before{display:none}.turn:hover .tbm{opacity:1}.tbm:hover{background:var(--hover);color:var(--acck)}
.tbm.on{color:var(--acck);opacity:1}.tbm.on path{fill:currentColor}
.sdone{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--faint);padding:3px 9px;border-radius:99px}.sdone .i{width:14px;height:14px}.sdone:hover{background:var(--hover);color:var(--ink)}
.sdone.on{color:var(--ink);background:var(--hover)}

/* theme wall */
.side{background:var(--wall);overflow:auto;padding:14px 14px 80px;border-radius:16px 0 0 0}
.wallpage{background:var(--wall);overflow:auto;padding:4px 22px 80px}
.wh{display:flex;align-items:center;gap:8px;margin:0 2px 12px}
.wh h2{font-size:16px;margin:0;font-weight:650}
.chiplink{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--acck);background:var(--accs);padding:5px 10px;border-radius:99px}
.explain{position:relative;background:var(--panel);border-radius:14px;padding:16px 18px;margin:0 0 16px;box-shadow:var(--shadow-s);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start}
.explain .bulb{width:38px;height:38px;border-radius:10px;background:var(--warn);color:var(--warnk);display:grid;place-items:center}
.explain h3{margin:0 0 4px;font-size:16px}
.explain p{margin:0 0 10px;color:var(--mute);max-width:72ch}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.step{background:var(--sub);border-radius:10px;padding:10px 12px;font-size:13px}
.step b{display:flex;align-items:center;gap:8px;margin-bottom:3px;font-size:13px}
.step b span{width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-size:12px}
.step em{font-style:normal;color:var(--mute)}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}
.side .cols{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.side .cols.one{grid-template-columns:1fr}
.subh{font-size:12px;font-weight:650;color:var(--faint);margin:8px 2px 0}
.col{border-radius:14px;padding:12px;background:var(--tf);color:var(--tk);transition:transform .15s,box-shadow .15s}
.col.over{box-shadow:0 0 0 3px var(--td)}
.col.over .cards::after{content:"Drop to add";display:block;border-radius:10px;padding:10px;text-align:center;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--td) 18%,transparent)}
.col.tover{transform:translateX(6px);box-shadow:-4px 0 0 var(--acc)}
.ch{display:flex;gap:6px;align-items:flex-start}
.ch .dot{width:10px;height:10px;border-radius:50%;background:var(--td);flex:none;margin-top:8px}
.tgrip{color:var(--tk);opacity:.45;cursor:grab;padding:4px 0;margin-left:-4px}
.tgrip:hover{opacity:1}
.col textarea{border:0;background:transparent;color:var(--tk);resize:none;field-sizing:content;width:100%;padding:2px 4px;border-radius:6px}
.col textarea:hover{background:color-mix(in srgb,var(--tk) 7%,transparent)}
.col textarea:focus{background:color-mix(in srgb,var(--panel) 70%,transparent);outline:none}
.col textarea.title{font-weight:650;font-size:14px;line-height:1.35;min-height:1.35em;flex:1;min-width:0}
.col textarea.idea{font-size:13px;line-height:1.45;min-height:1.45em;margin:2px 0 8px 12px;width:calc(100% - 12px)}
.col textarea::placeholder{color:color-mix(in srgb,var(--tk) 70%,transparent)}
.more{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;color:var(--tk);opacity:.7;flex:none}
.more:hover{background:color-mix(in srgb,var(--tk) 10%,transparent);opacity:1}
.topic{font-size:12px;background:var(--warn);color:var(--warnk);border-radius:10px;padding:7px 10px;margin:0 0 8px;display:flex;gap:7px}
.cards{display:flex;flex-direction:column;gap:6px;min-height:8px}
.dropzone{border-radius:10px;padding:14px 10px;text-align:center;font-size:13px;background:color-mix(in srgb,var(--td) 12%,transparent)}
.card{display:flex;align-items:center;gap:6px;background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 4px 6px 4px;font-size:13px;cursor:grab;box-shadow:var(--shadow-s);text-align:left}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.12)}
.card .g{color:var(--faint);opacity:.6}
.card .cl{flex:1;min-width:0;cursor:pointer}
.card .n{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;background:var(--sub);border-radius:99px;padding:1px 7px}
.card .more{color:var(--faint);width:24px;height:24px}
.pphead{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;margin:12px 0 6px;opacity:.85}
.pp{display:flex;flex-wrap:wrap;gap:4px}
.pp button{width:26px;height:26px;border-radius:50%;font:650 12px/26px var(--ui);background:var(--panel);color:var(--mute);transition:transform .12s}
.pp button:hover{transform:scale(1.12)}
.pp button.fit{background:var(--td);color:#fff}
.pp button.against{box-shadow:inset 0 0 0 2px var(--bad);color:var(--bad)}
.pp button.fit.against{color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:-4px 2px 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:50%;background:var(--panel)}
.legend i.f{background:var(--acc)}.legend i.a{box-shadow:inset 0 0 0 2px var(--bad)}
.addtheme{min-height:52px;white-space:nowrap;overflow:hidden;border-radius:14px;background:var(--panel);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:500;box-shadow:var(--shadow-s);color:var(--acck)}

/* codes view */
.page{overflow:auto;padding:4px 22px 80px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.toolbar .field{max-width:320px;height:36px}

.crow .tname{font-size:12px;border-radius:99px;padding:3px 9px;background:var(--tf,var(--sub));color:var(--tk,var(--mute));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;justify-self:start;max-width:100%}

.chead{display:grid;grid-template-columns:18px 22px minmax(0,1fr) 150px 80px 80px;gap:10px;font-size:12px;font-weight:600;color:var(--faint);padding:0 14px 2px 8px;max-width:1100px}

/* diary */
.diary{max-width:760px;margin:0 auto}
.prompts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.prompts button{font-size:13px;border-radius:99px;background:var(--panel);padding:5px 11px;box-shadow:var(--shadow-s);color:var(--mute)}

.dgroup{margin-top:22px}
.dgroup h3{font-size:13px;color:var(--faint);font-weight:600;margin:0 0 8px}
.entry{background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow-s);white-space:pre-wrap;line-height:1.55;position:relative}
.entry .tag{font-size:12px;font-weight:600;color:var(--pavk);background:var(--pav);border-radius:99px;padding:2px 8px;margin-bottom:6px;display:inline-block}

/* drawer */

.dh{display:flex;align-items:center;gap:10px;margin-bottom:14px}

.q{background:var(--panel);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:16px;line-height:1.65;cursor:pointer;display:block;width:100%;text-align:left;box-shadow:var(--shadow-s)}
.q:hover{box-shadow:0 0 0 2px var(--accs)}
.q small{display:flex;align-items:center;gap:6px;font:12px var(--ui);color:var(--faint);margin-top:4px}

.row{display:flex;gap:8px;align-items:center}
.danger{color:var(--bad);font-size:13px;display:inline-flex;gap:6px;align-items:center;padding:6px 0}

/* code box */
.pop{position:fixed;z-index:40;width:360px;background:var(--panel);color:var(--ink);border-radius:14px;padding:12px;box-shadow:var(--shadow),0 0 0 1px rgba(0,0,0,.04);animation:pop .16s cubic-bezier(.16,1,.3,1)}

.opt.new{color:var(--acck);font-weight:500;position:sticky;bottom:0;background:var(--panel)}.opt.new.on,.opt.new:hover{background:var(--hl)}
.pnote{font-size:13px;color:var(--warnk);background:var(--warn);border-radius:10px;padding:7px 10px;margin-top:8px;display:flex;gap:7px}
.pfirst{font-size:13px;color:var(--mute);padding:10px 6px 2px;line-height:1.5}

.pkeys{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--faint)}

.prow{display:flex;justify-content:space-between;align-items:center;margin-top:10px}

/* settings */
.set h3{font-size:13px;font-weight:650;color:var(--faint);margin:18px 0 8px}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fontcard{text-align:left;background:var(--panel);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow-s)}

<script>
"use strict";
const ICONS=__ICONS__;
const I=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`; // Lucide line icons, inlined by build.py
const PROJ=(()=>{try{return localStorage.getItem('recode-project')||'';}catch{return '';}})(); // the open project folder
const LS='recode-backup:'+PROJ, LS_P='recode-prefs';
const HUES=[ // fill, ink, deep, dark fill, dark ink
  ['#d8ece8','#1f564f','#2f7d74','rgba(47,125,116,.24)','#9fd8cc'],
  ['#f7e6c4','#6b4a12','#8f5c0e','rgba(200,140,40,.22)','#f0cd8a'],
  ['#f6dbe4','#7a2c48','#b0466a','rgba(190,80,120,.22)','#f2a9c1'],
  ['#dde6f0','#24466b','#3d6a9e','rgba(80,130,190,.24)','#a9c6ea'],
  ['#e5ead3','#4a5320','#5c6822','rgba(130,150,60,.24)','#c9d68f'],
  ['#ece0f0','#5b3466','#8a5a9a','rgba(150,100,170,.26)','#d5b4e2']];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toISOString().slice(0,10);
const typing=()=>/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)||document.activeElement?.isContentEditable;

let P={navShut:false,sheet:1,bar:'solid',view:'code',az:'dim',theme:'auto',pin:false,split:'58%',tour:false,explain:true,side:'codes',font:'newsreader',size:17,lh:1.8,ts:'hover',look:'guide',dw:860};
try{Object.assign(P,JSON.parse(localStorage.getItem(LS_P)||'{}'));}catch{}
const savePrefs=()=>{try{localStorage.setItem(LS_P,JSON.stringify(P));}catch{}};
let S=blank(), T={}, cur=null, mode='1', root=null, undo=[], redo=[], saveTimer=null, savedAt=null, recent=[];
function blank(){return {version:1,codes:{},highlights:[],themes:[],against:{},diary:[],canvas:{c:{},t:{}},roles:{},media:{}}}
function migrate(o){ // ponytail: forward-only; never drops saved work
  const s=Object.assign(blank(),o||{});
  s.highlights.forEach(h=>{h.codeIds=h.codeIds||[];h.round=h.round||1;});
  Object.values(s.codes).forEach(c=>{c.history=c.history||[];c.theme=c.theme??null;});
  s.themes.forEach((t,i)=>{if(t.hue==null)t.hue=i;});
  s.done=s.done||{}; // pid -> {section key: date the user ticked it}
  s.closed=s.closed||{}; // pid -> {r1 or r2: date the user closed that round for them}
  s.bm=s.bm||{}; // pid -> {turn index: its time stamp}
  s.cm=s.cm||[]; // comments: {id,pid,turn,t,by,text,at,re:[{by,text,at}],done}
  s.canvas=s.canvas||{c:{},t:{}}; // canvas view: code id -> [x,y], theme id -> [x,y,w,h]
  s.roles=s.roles||{}; // pid -> speaker names who ask the questions
  s.media=s.media||{}; // pid -> path of its audio or video file
  return s;
}
const isDark=()=>P.theme==='dark'||(P.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
const lookNow=()=>P.look==='paper'&&!isDark()?'paper':'guide'; // Paper has no Night version; Neutral was dropped 3 Nov
function hue(i){const h=HUES[(i||0)%HUES.length];return isDark()?`--tf:${h[3]};--tk:${h[4]};--td:${h[2]}`:`--tf:${h[0]};--tk:${h[1]};--td:${h[2]}`;}
const UNSORTED=()=>`--tf:var(--unsorted);--tk:var(--ink);--td:#8a877f`;
function themeOf(cid){const c=S.codes[cid];return c&&c.theme?S.themes.find(t=>t.id===c.theme):null;}
function codeVars(cid){const t=themeOf(cid);return t?hue(t.hue):UNSORTED();}
const people=cid=>new Set(S.highlights.filter(h=>h.codeIds.includes(cid)).map(h=>h.pid)).size;
const quotes=cid=>S.highlights.filter(h=>h.codeIds.includes(cid)).length;
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
function progress(pid){const n=T[pid]?.turns.length,r=FW.p[pid];if(!n||!r)return 0; // how far the user has read, never how many turns carry a code (the farthest mark lives in this browser, with the timer)
  const far=r.far??(r.seen?.length?Math.max(...r.seen):0);return far?Math.round(Math.min(1,(far+1)/n)*100):0;}

/* ---------- storage (unchanged from v1: never rewrites saved work) ---------- */
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('rta-coding',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}
async function kv(key,val){const db=await idb();return new Promise(ok=>{const tx=db.transaction('kv',val===undefined?'readonly':'readwrite');const st=tx.objectStore('kv');const r=val===undefined?st.get(key):st.put(val,key);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null);});}
const TAURI=window.__TAURI__,inv=(c,a)=>TAURI.core.invoke(c,a);
const pj=(...a)=>a.join('/'); // forward slashes work on Windows too
const DATA='project.json';
async function readJSON(path){return JSON.parse(await inv('read_text',{path}));}
function save(){
  S.savedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    if(!root){status();return;}
    try{if(await pullDisk(true))return; // another program changed the file since we last saw it: load theirs, never overwrite it
      await inv('write_text',{path:pj(root,DATA),text:JSON.stringify(S,null,1)});savedAt=new Date();known=S.savedAt;}
    catch(e){savedAt=null;toast('Could not save the project: '+e);}
    status();
  },600);
}
let known=0; // savedAt of project.json as this page last read or wrote it
async function pullDisk(writing){ // true if project.json is newer than what this page knows, and was loaded
  if(!root)return false;let disk;
  try{disk=migrate(await readJSON(pj(root,DATA)));}catch(e){return false;}
  if(!known){known=disk.savedAt||0;return false;}
  if((disk.savedAt||0)<=known)return false;
  S=disk;known=disk.savedAt;undo=[];redo=[]; // old snapshots predate the outside edit: undoing into them wiped it (28 Oct)
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}render();
  toast(writing?'project.json was changed by another program, so that version is loaded. Redo your last change.':'Loaded changes made to project.json by another program.');return true;}
addEventListener('focus',()=>pullDisk(false));document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullDisk(false);});
function status(){
  $$('.save').forEach(el=>{
    if(!root){el.className=el.className.replace(/ ?warn/,'')+' warn';el.innerHTML='<i></i><span class="st">No project open</span>';el.dataset.tip='Open or start a project so your work saves to a folder on this computer';return;}
    el.className=el.className.replace(/ ?warn/,'');el.innerHTML='<i></i><span class="st">'+(savedAt?'Saved '+savedAt.toTimeString().slice(0,5):'Project open')+'</span>';el.dataset.tip='Every change saves to project.json in '+root;});
}
function change(fn,redraw=true,cm){if(mode==='view'&&!cm){toast('Comment only. Switch to Round 1 or 2 to change codes.');muteToast=Date.now();return;}undo.push(JSON.stringify(S));if(undo.length>80)undo.shift();redo=[];fn();save();if(redraw)render();}
const roundNo=()=>mode==='2'?2:1,roundClosed=pid=>(S.closed?.[pid]||{})['r'+roundNo()];
function toggleRound(){const n=roundNo(),k='r'+n,was=roundClosed(cur);change(()=>{const d=S.closed[cur]=S.closed[cur]||{};if(was)delete d[k];else d[k]=new Date().toLocaleDateString('en-CA');});toast(was?`Round ${n} reopened for ${cur}`:`Round ${n} closed for ${cur}`,['Undo',doUndo]);}
function toggleDone(k){const was=(S.done[cur]||{})[k];change(()=>{const d=S.done[cur]=S.done[cur]||{};if(was)delete d[k];else d[k]=today();});toast(was?'Marked not done':'Part marked done',['Undo',doUndo]);}
function toggleBm(i){const was=(S.bm[cur]||{})[i];change(()=>{const b=S.bm[cur]=S.bm[cur]||{};if(was)delete b[i];else b[i]=T[cur].turns[i].t;});toast(was?'Bookmark removed':'Bookmarked. It is listed at the top of the interview map.',['Undo',doUndo]);}
let cmPend=null; // words picked for a comment not yet posted
function cmSpans(i){const L=S.cm.filter(c=>c.pid===cur&&c.turn===i&&!c.done&&c.end>c.start).map(c=>({id:c.id,start:c.start,end:c.end}));if(cmPend&&cmPend.turn===i)L.push({id:'new',start:cmPend.start,end:cmPend.end});return L;}
function cmWho(){if(!P.who){P.who=(prompt('Your name, shown on your comments')||'').trim()||'Viewer';savePrefs();}return P.who;}
const cmDate=a=>new Date(a).toLocaleDateString([],{day:'numeric',month:'short'});
function cmHTML(i){const L=S.cm.filter(c=>c.pid===cur&&c.turn===i&&!c.done);if(!L.length)return '';const me=P.who;
  return L.map(c=>`<div class="cmt" data-cmid="${c.id}"><div class="ch"><span class="cav">${esc(c.by[0]||'?')}</span><b>${esc(c.by)}</b><span class="cdt">${cmDate(c.at)}</span><span class="grow"></span>${mode!=='view'?`<button class="cic" data-cmdone="${c.id}" data-tip="Resolve" aria-label="Resolve">${I('check','s')}</button>`:''}${mode!=='view'||c.by===me?`<button class="cic" data-cmdel="${c.id}" data-tip="Delete" aria-label="Delete">${I('x','s')}</button>`:''}</div><div class="cb">${esc(c.text)}</div>`
    +(c.re||[]).map(r=>`<div class="crr"><span class="cav sm">${esc(r.by[0]||'?')}</span><div><b>${esc(r.by)}</b> <span class="cdt">${cmDate(r.at)}</span><div class="cb">${esc(r.text)}</div></div></div>`).join('')
    +`<button class="crep" data-cmrep="${c.id}">Reply</button></div>`).join('');}
function cmNew(i){const t=document.querySelector(`#t-${i}`);if(!t)return;t.querySelector('.cmt.new')?.remove();let tx=t.querySelector('.cmc');if(!tx){tx=document.createElement('aside');tx.className='cmc';t.appendChild(tx);}const d=document.createElement('div');d.className='cmt new';
  d.innerHTML=`<textarea class="cin" rows="2" placeholder="Add a comment"></textarea><div class="ch"><span class="grow"></span><button data-cmcancel="1">Cancel</button><button class="pri" data-cmadd="${i}">Comment</button></div>`;tx.appendChild(d);layoutComments();d.querySelector('textarea').focus();}
function cmAdd(i,text){text=text.trim();if(!text)return;const by=cmWho(),sp=cmPend&&cmPend.turn===i?cmPend:null;cmPend=null;change(()=>S.cm.push({id:'c'+Date.now().toString(36),pid:cur,turn:i,t:T[cur].turns[i].t,...(sp?{start:sp.start,end:sp.end}:{}),by,text,at:new Date().toISOString(),re:[]}),true,true);toast('Comment added',['Undo',doUndo]);}
function cmEdit(id,fn,msg){change(()=>{const c=S.cm.find(x=>x.id===id);if(c)fn(c);},true,true);if(msg)toast(msg,['Undo',doUndo]);}
function cmHot(id,on){$$('#desk [data-cmk]').forEach(m=>{if(m.dataset.cmk.split(',').includes(id))m.classList.toggle('on',on);});$$(`#desk .cmt[data-cmid="${id}"]`).forEach(c=>c.classList.toggle('on',on));}
function doUndo(){if(!undo.length){toast('Nothing to undo');return;}redo.push(JSON.stringify(S));S=JSON.parse(undo.pop());save();render();toast('Undone',['Redo',doRedo]);}
function doRedo(){if(!redo.length){toast('Nothing to redo');return;}undo.push(JSON.stringify(S));S=JSON.parse(redo.pop());save();render();toast('Redone',['Undo',doUndo]);}

/* ---------- project: a folder with project.json and transcripts/ ---------- */
async function connect(){
  if(!PROJ){render();return;}
  try{
    if(!await inv('exists',{path:pj(PROJ,DATA)})){localStorage.removeItem('recode-project');location.reload();return;}
    root=PROJ;
    if(await loadData()===false)return;await loadTranscripts();status();render();maybeTour();
  }catch(e){toast('Could not open the project: '+e);}
}
async function loadData(){ // never drops work: keeps whichever copy was saved last
  let disk;try{disk=migrate(await readJSON(pj(root,DATA)));}catch(e){root=null;toast('project.json could not be read, so nothing was written to it.');return false;}
  let mine=null;try{const ls=localStorage.getItem(LS);if(ls)mine=migrate(JSON.parse(ls));}catch(e){}
  if(mine&&(mine.savedAt||0)>(disk.savedAt||0)){S=mine;save();toast('Unsaved work from your last session was found and saved.');}
  else S=disk;
  known=(S.savedAt>(disk.savedAt||0))?0:disk.savedAt||0;
}
async function loadTranscripts(){
  T={};const dir=pj(root,'transcripts');
  for(const [name,isDir] of await inv('list_dir',{path:dir}).catch(()=>[])){
    if(isDir||!/\.md$/i.test(name))continue;
    const pid=name.replace(/\.md$/i,''),r=TX.read(await inv('read_text',{path:pj(dir,name)}));
    T[pid]={file:name,turns:r.turns,sections:r.sections,timed:r.timed,title:r.title};
    if(!S.roles[pid])S.roles[pid]=r.interviewer;
  }
  pickDefault();
}
const asks=(pid,spk)=>(S.roles[pid]||[]).includes(spk); // is this speaker the interviewer in this transcript
const initials=n=>{const w=String(n||'?').trim().split(/\s+/);return (w.length>1?w[0][0]+w.at(-1)[0]:w[0].slice(0,2)).toUpperCase();};
function pickDefault(){const ids=Object.keys(T).sort();let last=null;try{last=localStorage.getItem(LS+'-cur');}catch{}cur=ids.includes(last)?last:(ids.includes(cur)?cur:ids[0]);}
// Codes in other people whose names share the most words with this quote's codes. Word overlap only, so it misses the same idea in other words.
// ponytail: label-word Jaccard, rebuilt per render; upgrade to embeddings if it misses too much.
const hw=s=>new Set((s.toLowerCase().match(/[a-z']+/g)||[]).filter(w=>!HSTOP.has(w)).map(w=>w.length>4&&w.endsWith('s')?w.slice(0,-1):w));
const HSTOP=new Set('a an the to of for and or in on as is it its by with that this they their them about not but be at from what how when if so than then would want wants'.split(' '));
function closeCodes(h){const mine=hw(h.codeIds.map(c=>S.codes[c]?.label||'').join(' '));if(!mine.size)return[];const who={};
  S.highlights.forEach(y=>{if(y.pid!==h.pid)y.codeIds.forEach(c=>{if(!h.codeIds.includes(c))(who[c]=who[c]||new Set()).add(y.pid);});});
  return Object.keys(who).map(c=>{const w=hw(S.codes[c]?.label||'');let n=0;w.forEach(x=>mine.has(x)&&n++);return [n/(mine.size+w.size-n||1),c];}).filter(a=>a[0]>=.3).sort((a,b)=>b[0]-a[0]).slice(0,3).map(([,c])=>({c,who:[...who[c]].sort()}));}

/*__TRANSCRIPT_JS__*/
const SAMPLE=/*__SAMPLE__*/null;
/*__PROJECT_JS__*/
const RQ=t=>esc(t);

/* ---------- audio: the full recording beside the transcript ---------- */
const au=$('#audio');let audFor=null;
function audioFor(pid){if(!pid)$('#player').hidden=true;if(!pid||audFor===pid)return;audFor=pid;const m=S.media[pid];if(m)au.src=TAURI.core.convertFileSrc(m);else au.removeAttribute('src');au.playbackRate=+(P.rate||1);}
async function linkMedia(pid=cur){if(!pid)return;const f=await TAURI.dialog.open({title:'Pick the recording for '+pid,filters:[{name:'Audio or video',extensions:['mp3','m4a','wav','aac','ogg','flac','mp4','m4v','mov','webm']}]});if(!f)return;
  change(()=>{S.media[pid]=f;},false);audFor=null;audioFor(pid);toast('Recording linked to '+pid);}

/* drag: pointer events, so it works with mouse and touch. Codes onto themes, or (in Codes) onto another code to merge; themes onto themes to reorder */
let drag=null,justDragged=false;
document.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;const th=e.target.closest('[data-themedrag]');const el=th?null:e.target.closest('[data-code]');if(!th&&!el)return;
  if(e.target.closest('.more,textarea,input'))return;
  if(e.pointerType==='touch'&&!e.target.closest('.g,.tgrip'))return; // on touch, drag from the grip so the page still scrolls
  drag={kind:th?'theme':'code',id:th?th.dataset.themedrag:el.dataset.code,src:th?th.closest('.col'):el,x:e.clientX,y:e.clientY,on:false};
});
function dragTarget(x,y,d=drag){const t=document.elementFromPoint(x,y);if(!t)return null;
  if(d.kind==='code'){const row=t.closest('.crow');if(row&&row.dataset.code!==d.id)return row;return t.closest('.col');}
  const col=t.closest('.col[data-theme]:not([data-theme=""])');return col&&col.dataset.theme!==d.id?col:null;}
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.on){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
    drag.on=true;hideTip();getSelection().removeAllRanges();document.body.classList.add('dragging-on');drag.src.classList.add('dragging');
    drag.ghost=document.createElement('div');drag.ghost.className='ghost drag';drag.ghost.textContent=drag.kind==='code'?S.codes[drag.id]?.label:(S.themes.find(t=>t.id===drag.id)?.name||'Unnamed theme');document.body.append(drag.ghost);}
  e.preventDefault();drag.ghost.style.left=e.clientX+14+'px';drag.ghost.style.top=e.clientY+10+'px';
  const tg=dragTarget(e.clientX,e.clientY);
  $$('.over,.tover,.mover').forEach(x=>x!==tg&&x.classList.remove('over','tover','mover'));
  if(tg)tg.classList.add(drag.kind==='theme'?'tover':tg.classList.contains('crow')?'mover':'over');
  const sc=document.elementFromPoint(e.clientX,e.clientY)?.closest('.side,.wallpage,.page');
  if(sc){const r=sc.getBoundingClientRect();if(e.clientY<r.top+50)sc.scrollTop-=14;else if(e.clientY>r.bottom-50)sc.scrollTop+=14;}
});
function endDrag(e,cancel){
  if(!drag)return;const d=drag;drag=null;if(!d.on)return;
  justDragged=true;setTimeout(()=>justDragged=false,0);
  d.ghost.remove();document.body.classList.remove('dragging-on');d.src.classList.remove('dragging');
  const tg=cancel?null:dragTarget(e.clientX,e.clientY,d);$$('.over,.tover,.mover').forEach(x=>x.classList.remove('over','tover','mover'));
  if(!tg)return;
  if(d.kind==='code'){if(!S.codes[d.id])return;if(tg.classList.contains('crow'))mergeCodes(d.id,tg.dataset.code);else{const tid=tg.dataset.theme||null;if(S.codes[d.id].theme!==tid){moveCode(d.id,tid);const t=S.themes.find(x=>x.id===tid);toast(`Moved to ${t?'"'+(t.name||'unnamed theme')+'"':'no theme'}`,['Undo',doUndo]);}}}
  else change(()=>{const a=S.themes.findIndex(t=>t.id===d.id),b=S.themes.findIndex(t=>t.id===tg.dataset.theme);S.themes.splice(b,0,S.themes.splice(a,1)[0]);});
}
document.addEventListener('pointerup',e=>endDrag(e));
document.addEventListener('pointercancel',e=>endDrag(e,true));
document.addEventListener('click',e=>{if(justDragged){e.stopPropagation();e.preventDefault();}},true);

/* ---------- canvas view of the Themes page: free wall, tidy when the user wants ----------
   Codes are notes, themes are boxes; a code's theme is still S.codes[id].theme. Positions live in S.canvas
   (saved with the user's work, undo covers them); the camera is a per-browser pref (P.cvcam). */
const CV={el:{},sel:new Set(),root:null,L:{t:{},c:{}},tool:matchMedia('(pointer:coarse)').matches?'hand':'select',space:false,G:[]};
const CVW=150,CVG=12,CVP=14,CVH=72,CVSNAP=6;
const cvCam=()=>P.cvcam||{x:24,y:24,s:.8};
const cvH=cid=>CV.el['c'+cid]?.offsetHeight||64;
const cvWho=cid=>[...new Set(S.highlights.filter(h=>h.codeIds.includes(cid)).map(h=>h.pid))].sort();
const cvPids=()=>{const k=Object.keys(T);return k.length?k:[...new Set(S.highlights.map(h=>h.pid))];};
const setVars=(e,str)=>str.split(';').forEach(d=>{const i=d.indexOf(':');if(i>0)e.style.setProperty(d.slice(0,i).trim(),d.slice(i+1).trim());});
function cvShow(){
  const wp=$('#wallPage');wp.classList.add('cvmode');
  if(!CV.root?.isConnected){CV.el={};
    wp.innerHTML=`<div class="cv" id="cv"><div class="cvw"><div class="cvfl"></div><div class="cvnl"></div></div>
      <div class="cvtools"><button data-cvtool="select" data-tip="Select and move (V)">Select</button><button data-cvtool="hand" data-tip="Move around (H, or hold Space)">Hand</button><i></i><button data-cva="theme" data-tip="Add a theme box in the middle of the view">New theme</button><button data-cva="tidyall" data-tip="Line up the codes inside every theme">Tidy all</button></div>
      <div class="cvzoom"><button data-cvz="-" aria-label="Zoom out">−</button><span></span><button data-cvz="+" aria-label="Zoom in">+</button><button data-cvz="fit" data-tip="Fit everything in view">Fit</button></div>
      <div class="cvhint">Drag empty space to select · Space or scroll to move · Pinch or Ctrl + scroll to zoom · Click a code for its quotes</div></div>`;
    CV.root=$('#cv');cvWire();cvTool(CV.tool);cvRender();if(P.cvcam)cvApplyCam();else cvFit(true);return;}
  cvRender();
}
function cvLayout(){ // saved spots first; anything new gets a default spot (saved on the user's next canvas change)
  const sc=S.canvas,L={t:{},c:{}};let right=0;
  S.themes.forEach(t=>{const p=sc.t[t.id];if(p){L.t[t.id]=[...p];right=Math.max(right,p[0]+p[2]);}});
  S.themes.forEach(t=>{if(!L.t[t.id]){const x=right?right+24:0;L.t[t.id]=[x,0,340,200];right=x+340;}});
  const loose=[],need={};
  Object.keys(S.codes).forEach(cid=>{const p=sc.c[cid],th=S.codes[cid].theme;
    if(p)L.c[cid]=[...p];else if(th&&L.t[th])(need[th]=need[th]||[]).push(cid);else loose.push(cid);});
  for(const tid in need){const f=L.t[tid],cols=Math.max(1,Math.floor((f[2]-2*CVP+CVG)/(CVW+CVG)));
    let y=Math.max(f[1]+CVH,...Object.keys(L.c).filter(c=>S.codes[c]?.theme===tid).map(c=>L.c[c][1]+cvH(c)+CVG));
    for(let i=0;i<need[tid].length;i+=cols){const row=need[tid].slice(i,i+cols);row.forEach((c,j)=>L.c[c]=[f[0]+CVP+j*(CVW+CVG),y]);y+=Math.max(...row.map(cvH))+CVG;}
    f[3]=Math.max(f[3],y-f[1]-CVG+CVP);}
  if(loose.length){loose.sort((a,b)=>people(b)-people(a));
    const saved=Object.keys(L.c).filter(c=>!S.codes[c]?.theme),x0=right?right+60:0;
    let y=saved.length?Math.max(...saved.map(c=>L.c[c][1]+cvH(c)))+40:0;
    const cols=Math.max(4,Math.ceil(Math.sqrt(loose.length*1.6)));

function cvRender(anim){

  const ids=new Set([...S.themes.map(t=>'t'+t.id),...Object.keys(S.codes).map(c=>'c'+c)]);

  [...CV.sel].forEach(c=>{if(!S.codes[c])CV.sel.delete(c);});

    const c=S.codes[cid],who=cvWho(cid);
    e.className='cvn'+(c.theme?' in':'')+(CV.sel.has(cid)?' sel':'');setVars(e,codeVars(cid));
    const html=`${esc(c.label)}<span class="cvd">${who.map(()=>'<i></i>').join('')}</span>`;if(e.innerHTML!==html)e.innerHTML=html;
    e.dataset.tip=`${who.length} of ${pids.length} people: ${who.join(', ')||'none'}. Click to see the quotes.`;});
  CV.L=cvLayout();
  S.themes.forEach(t=>{let e=el['t'+t.id];
    if(!e){e=el['t'+t.id]=document.createElement('div');e.className='cvf';e.dataset.cvth=t.id;
      e.innerHTML=`<div class="cvh"><div class="cvx"><span class="cvname"></span><span class="cvmeta"></span></div><button class="cvtidy" data-tip="Line up the codes in this theme">Tidy</button><button class="more btn icon ghost" data-thememenu="${t.id}" data-tip="Theme options" aria-label="Theme options">${I('ellipsis','s')}</button></div><div class="cvrs" data-tip="Drag to resize"></div>`;FL.appendChild(e);}
    const [x,y,wd,ht]=CV.L.t[t.id],codes=Object.keys(S.codes).filter(c=>S.codes[c].theme===t.id),fits=new Set(S.highlights.filter(h=>h.codeIds.some(c=>codes.includes(c))).map(h=>h.pid));
    setVars(e,hue(t.hue));Object.assign(e.style,{left:x+'px',top:y+'px',width:wd+'px',height:ht+'px'});

  if(none&&!em){em=document.createElement('div');em.className='cvempty';em.textContent='Press New theme to make a box, then drag codes into it.';CV.root.appendChild(em);}else if(!none&&em)em.remove();

}
function cvSnapshot(){const r=v=>v.map(Math.round);S.canvas={c:Object.fromEntries(Object.entries(CV.L.c).filter(([k])=>S.codes[k]).map(([k,v])=>[k,r(v)])),t:Object.fromEntries(Object.entries(CV.L.t).filter(([k])=>S.themes.some(t=>t.id===k)).map(([k,v])=>[k,r(v)]))};}
function cvCommit(fn,msg,anim=true){change(()=>{fn&&fn();cvSnapshot();},false);cvRender(anim);if(msg)toast(msg,['Undo',doUndo]);}
function cvApplyCam(){if(!CV.root)return;const c=cvCam();CV.root.querySelector('.cvw').style.transform=`translate(${c.x}px,${c.y}px) scale(${c.s})`;CV.root.querySelector('.cvzoom span').textContent=Math.round(c.s*100)+'%';}

function cvZoomAt(px,py,ns){const c=cvCam();ns=Math.min(2,Math.max(.25,ns));cvSetCam({x:px-(px-c.x)*ns/c.s,y:py-(py-c.y)*ns/c.s,s:ns});}
function cvFit(quiet){const L=CV.L,xs=[],ys=[];
  for(const k in L.t){const f=L.t[k];xs.push(f[0],f[0]+f[2]);ys.push(f[1],f[1]+f[3]);}
  for(const k in L.c){const p=L.c[k];xs.push(p[0],p[0]+CVW);ys.push(p[1],p[1]+cvH(k));}
  if(!xs.length)return;const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),r=CV.root.getBoundingClientRect();
  const s=Math.min(1.2,Math.max(.25,Math.min((r.width-60)/(x1-x0),(r.height-110)/(y1-y0))));
  const w=CV.root.querySelector('.cvw');if(!quiet){w.style.transition='transform .25s';setTimeout(()=>w.style.transition='',260);}
  cvSetCam({x:(r.width-(x1-x0)*s)/2-x0*s,y:(r.height-50-(y1-y0)*s)/2-y0*s+10,s});}
function cvTool(t){CV.tool=t;CV.root?.classList.toggle('hand',t==='hand');CV.root?.querySelectorAll('[data-cvtool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cvtool===t));}
function cvTidy(tid){const f=CV.L.t[tid];if(f[2]<CVW+2*CVP)f[2]=CVW+2*CVP;
  const ns=Object.keys(S.codes).filter(c=>S.codes[c].theme===tid).sort((a,b)=>Math.round((CV.L.c[a][1]-f[1])/40)-Math.round((CV.L.c[b][1]-f[1])/40)||CV.L.c[a][0]-CV.L.c[b][0]);
  const cols=Math.max(1,Math.floor((f[2]-2*CVP+CVG)/(CVW+CVG)));let y=f[1]+CVH;
  for(let i=0;i<ns.length;i+=cols){const row=ns.slice(i,i+cols);row.forEach((c,j)=>CV.L.c[c]=[f[0]+CVP+j*(CVW+CVG),y]);y+=Math.max(...row.map(cvH))+CVG;}
  f[3]=Math.max(y-f[1]-CVG+CVP,CVH+60);}
function cvGrow(tid,cid){const f=CV.L.t[tid],p=CV.L.c[cid];p[0]=Math.max(p[0],f[0]+CVP);p[1]=Math.max(p[1],f[1]+CVH); // slide in, never grow over a neighbour
  const r=p[0]+CVW+CVP,b=p[1]+cvH(cid)+CVP;if(r>f[0]+f[2])f[2]=r-f[0];if(b>f[1]+f[3])f[3]=b-f[1];}
const cvThemeAt=(x,y)=>[...S.themes].reverse().find(t=>{const f=CV.L.t[t.id];return f&&x>f[0]&&x<f[0]+f[2]&&y>f[1]&&y<f[1]+f[3];});
const cvCentre=cid=>({x:CV.L.c[cid][0]+CVW/2,y:CV.L.c[cid][1]+cvH(cid)/2});
function cvSetTheme(cid,t){const c=S.codes[cid],tid=t?t.id:null;if(c.theme===tid)return false;
  c.history.push({date:today(),note:t?`Moved to theme "${t.name||'unnamed'}"`:'Taken out of its theme'});c.theme=tid;return true;}
function cvGuides(p,dx,dy,others){ // snap the grabbed note's edges or centre to another note's, within a few screen pixels
  const s=cvCam().s,thr=CVSNAP/s,ph=cvH(p.id);let bx=null,by=null;
  const px=[p.x+dx,p.x+dx+CVW/2,p.x+dx+CVW],py=[p.y+dy,p.y+dy+ph/2,p.y+dy+ph];
  for(const o of others){const [ox0,oy0]=CV.L.c[o],oh=cvH(o),ox=[ox0,ox0+CVW/2,ox0+CVW],oy=[oy0,oy0+oh/2,oy0+oh];
    for(let i=0;i<3;i++){const d=ox[i]-px[i];if(Math.abs(d)<thr&&(!bx||Math.abs(d)<Math.abs(bx.d)))bx={d,x:ox[i],o};
      const e=oy[i]-py[i];if(Math.abs(e)<thr&&(!by||Math.abs(e)<Math.abs(by.d)))by={d:e,y:oy[i],o};}}
  CV.G.forEach(g=>g.remove());CV.G=[];const w=CV.root.querySelector('.cvw');
  const line=css=>{const g=document.createElement('div');g.className='cvguide';g.style.cssText=css;w.appendChild(g);CV.G.push(g);};
  if(bx){const [,oy]=CV.L.c[bx.o],y0=Math.min(p.y+dy,oy)-8,y1=Math.max(p.y+dy+ph,oy+cvH(bx.o))+8;line(`left:${bx.x}px;top:${y0}px;width:${1/s}px;height:${y1-y0}px`);}
  if(by){const [ox]=CV.L.c[by.o],x0=Math.min(p.x+dx,ox)-8,x1=Math.max(p.x+dx+CVW,ox+CVW)+8;line(`top:${by.y}px;left:${x0}px;height:${1/s}px;width:${x1-x0}px`);}

function cvWire(){
  const st=CV.root;
  const toWorld=e=>{const r=st.getBoundingClientRect(),c=cvCam();return{x:(e.clientX-r.left-c.x)/c.s,y:(e.clientY-r.top-c.y)/c.s};};
  const drag=(e,move,end)=>{const s=toWorld(e);let moved=false;
    const mv=ev=>{const p=toWorld(ev);if(!moved&&Math.hypot(p.x-s.x,p.y-s.y)*cvCam().s<4)return;if(!moved)hideTip();moved=true;move(p.x-s.x,p.y-s.y);};
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);end(moved);};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);};
  st.addEventListener('pointerdown',e=>{
    const t=e.target;if(t.closest('.cvtools,.cvzoom,.more,.cvtidy,.cvin'))return;
    if(CV.tool==='hand'||CV.space||e.button===1){e.preventDefault();st.classList.add('panning');const c=cvCam(),ox=e.clientX-c.x,oy=e.clientY-c.y;
      const mv=ev=>{P.cvcam={x:ev.clientX-ox,y:ev.clientY-oy,s:c.s};cvApplyCam();};
      const up=()=>{st.classList.remove('panning');savePrefs();removeEventListener('pointermove',mv);removeEventListener('pointerup',up);};
      addEventListener('pointermove',mv);addEventListener('pointerup',up);return;}

      if(e.shiftKey){CV.sel.has(cid)?CV.sel.delete(cid):CV.sel.add(cid);cvRender();return;}
      if(!CV.sel.has(cid))CV.sel=new Set([cid]);
      const group=[...CV.sel],start=group.map(c=>[...CV.L.c[c]]),others=Object.keys(S.codes).filter(c=>!CV.sel.has(c)),i0=group.indexOf(cid);
      Object.keys(S.codes).forEach(c=>CV.el['c'+c].classList.toggle('sel',CV.sel.has(c)));
      drag(e,(dx,dy)=>{group.forEach(c=>CV.el['c'+c].classList.add('drag'));
          const g=cvGuides({id:cid,x:start[i0][0],y:start[i0][1]},dx,dy,others);
          group.forEach((c,i)=>{CV.L.c[c]=[start[i][0]+g.dx,start[i][1]+g.dy];CV.el['c'+c].style.left=CV.L.c[c][0]+'px';CV.el['c'+c].style.top=CV.L.c[c][1]+'px';});
          const p=cvCentre(cid),hot=cvThemeAt(p.x,p.y);S.themes.forEach(th=>CV.el['t'+th.id].classList.toggle('hot',th===hot));},
        moved=>{CV.G.forEach(g=>g.remove());CV.G=[];group.forEach(c=>CV.el['c'+c]?.classList.remove('drag'));S.themes.forEach(th=>CV.el['t'+th.id].classList.remove('hot'));
          if(!moved){openCode(cid);return;}
          let to,n=0;cvCommit(()=>{group.forEach(c=>{const p=cvCentre(c),th=cvThemeAt(p.x,p.y);if(cvSetTheme(c,th)){n++;to=th;}if(th)cvGrow(th.id,c);});},null);

    const rs=t.closest('.cvrs'),hd=t.closest('.cvh');
    if(rs||hd){const tid=(rs||hd).closest('.cvf').dataset.cvth,f=CV.L.t[tid],f0=[...f],kids=Object.keys(S.codes).filter(c=>S.codes[c].theme===tid),k0=kids.map(c=>[...CV.L.c[c]]);
      drag(e,(dx,dy)=>{if(rs){f[2]=Math.max(CVW+2*CVP,f0[2]+dx);f[3]=Math.max(CVH+60,f0[3]+dy);}
          else{f[0]=f0[0]+dx;f[1]=f0[1]+dy;kids.forEach((c,i)=>{CV.L.c[c]=[k0[i][0]+dx,k0[i][1]+dy];CV.el['c'+c].style.left=CV.L.c[c][0]+'px';CV.el['c'+c].style.top=CV.L.c[c][1]+'px';});}
          Object.assign(CV.el['t'+tid].style,{left:f[0]+'px',top:f[1]+'px',width:f[2]+'px',height:f[3]+'px'});},
        moved=>{if(!moved)return;cvCommit(()=>{if(rs)kids.forEach(c=>{const p=cvCentre(c);if(cvThemeAt(p.x,p.y)?.id!==tid)cvSetTheme(c,cvThemeAt(p.x,p.y));});},null,false);});
      return;}

    drag(e,(dx,dy)=>{if(!m.isConnected)st.querySelector('.cvw').appendChild(m);const x0=Math.min(s.x,s.x+dx),y0=Math.min(s.y,s.y+dy),x1=Math.max(s.x,s.x+dx),y1=Math.max(s.y,s.y+dy);
        m.style.cssText=`left:${x0}px;top:${y0}px;width:${x1-x0}px;height:${y1-y0}px;border-width:${1/cvCam().s}px`;
        CV.sel=new Set(base);Object.keys(S.codes).forEach(c=>{const [x,y]=CV.L.c[c];if(x<x1&&x+CVW>x0&&y<y1&&y+cvH(c)>y0)CV.sel.add(c);CV.el['c'+c].classList.toggle('sel',CV.sel.has(c));});},

    const tb=e.target.closest('[data-cvtool]');if(tb)return cvTool(tb.dataset.cvtool);

    if(a==='tidyall'){if(!S.themes.length)return toast('No themes yet. Press New theme first.');cvCommit(()=>S.themes.forEach(t=>cvTidy(t.id)),'Tidied every theme');return;}
    if(a==='theme'){const r=st.getBoundingClientRect(),c=cvCam(),id=uid();
      cvCommit(()=>{const used=S.themes.map(t=>t.hue);let hh=0;while(used.includes(hh)&&hh<HUES.length)hh++;S.themes.push({id,name:'',idea:'',hue:hh%HUES.length});
        let x=Math.round((r.width/2-c.x)/c.s-170),y=Math.round((r.height/2-c.y)/c.s-100);
        const hit=(x0,y0)=>Object.entries(CV.L.c).some(([k,p])=>p[0]<x0+340&&p[0]+CVW>x0&&p[1]<y0+200&&p[1]+cvH(k)>y0)||Object.values(CV.L.t).some(f=>f[0]<x0+340&&f[0]+f[2]>x0&&f[1]<y0+200&&f[1]+f[3]>y0);
        if(hit(x,y)){y=Math.min(...Object.values(CV.L.c).map(p=>p[1]),...Object.values(CV.L.t).map(f=>f[1]))-240;while(hit(x,y))x+=360;} // never on top of codes: the row above everything

}
function cvRename(tid){const e=CV.el['t'+tid];if(!e||e.querySelector('.cvin'))return;const nm=e.querySelector('.cvname'),t=S.themes.find(x=>x.id===tid);
  const inp=document.createElement('input');inp.className='cvin';inp.value=t.name;inp.placeholder='Name it as a claim';inp.setAttribute('aria-label','Theme name');

    if(keep&&v!==t.name)cvCommit(()=>{S.themes.find(x=>x.id===tid).name=v;},null,false);else cvRender();};

document.addEventListener('keydown',e=>{ // capture: Space pans here instead of playing audio
  if(P.view!=='themes'||P.wall!=='canvas'||typing()||!CV.root?.isConnected)return;
  if(e.code==='Space'){e.preventDefault();e.stopImmediatePropagation();if(!CV.space){CV.space=true;CV.root.classList.add('space');}return;}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'&&CV.sel.size&&!$('.modal')&&!pop&&!drawerCode){e.stopImmediatePropagation();CV.sel=new Set();cvRender();return;}
  if(e.key==='v'||e.key==='h'){e.stopImmediatePropagation();cvTool(e.key==='v'?'select':'hand');return;}
  if(CV.sel.size&&e.key.startsWith('Arrow')){e.preventDefault();e.stopImmediatePropagation();const d=e.shiftKey?10:1,dx=e.key==='ArrowLeft'?-d:e.key==='ArrowRight'?d:0,dy=e.key==='ArrowUp'?-d:e.key==='ArrowDown'?d:0;
    cvCommit(()=>CV.sel.forEach(c=>{CV.L.c[c][0]+=dx;CV.L.c[c][1]+=dy;}),null,false);}
},true);
document.addEventListener('keyup',e=>{if(e.code==='Space'&&CV.space){CV.space=false;CV.root?.classList.remove('space');}});

/* ---------- boot ---------- */

/* ---------- reading place: where you were in each transcript and how far you have read. Kept on this computer, per project, never in project.json ---------- */
const FWK='recode-place:'+PROJ,FW=Object.assign({p:{}},(()=>{try{return JSON.parse(localStorage.getItem(FWK))||{}}catch(e){return {}}})());
const FWRT={placed:null};
const fwSave=()=>{try{localStorage.setItem(FWK,JSON.stringify(FW));}catch(e){}};

function fwPos(){if(FWRT.placed!==cur||!cur||P.view!=='code')return;const a=deskAnchor($('#desk'));if(!a)return;const r=FW.p[cur]=FW.p[cur]||{},i=+a[0].slice(2);r.pos=a;if(!(r.far>=i))r.far=i;}
let fwT=0;$('#desk').addEventListener('scroll',()=>{clearTimeout(fwT);fwT=setTimeout(()=>{fwPos();fwSave();renderNav();},500);},{passive:true});

render();connect();
